name: LearNexus CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─── BACKEND CHECK ───────────────────────────
  backend:
    name: Backend (Python / Flask)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check code style (flake8)
        run: |
          pip install flake8
          flake8 api/ --max-line-length=120 --ignore=E501,W503,E302,E303,F811,E203,E241,E128,E124,E127,E221,W291,W293,F401,E402,E305,W292

